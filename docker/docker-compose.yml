services:
  database:
    image: postgres:16
    container_name: fitness_club_database
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: fitness_club_backend
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - database

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: fitness_club_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
